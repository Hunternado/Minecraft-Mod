name: Build

on:
  push:
    branches: ['**']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Check resources
        run: python3 tools/validate_resources.py

      - name: Build
        run: ./gradlew build --no-daemon --stacktrace --warning-mode all

      - name: Upload mod jar
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: frieren-mod-jar
          path: build/libs/*.jar
          if-no-files-found: error
