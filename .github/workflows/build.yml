name: Build

on:
  push:
    branches-ignore: ['ci-artifacts']
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Check resources
        run: python3 tools/validate_resources.py

      - name: Build
        run: ./gradlew build --no-daemon --stacktrace --warning-mode all

      - name: Upload mod jar
        uses: actions/upload-artifact@v4
        with:
          name: frieren-mod-jar
          path: build/libs/*.jar
          if-no-files-found: error

      - name: Probe Minecraft API signatures
        if: always()
        run: tools/ci_probe.sh

      # Commit messages containing [api] publish javap signatures of the classes in tools/ci_api_packages.txt
      # to the ci-artifacts branch (api/).
      - name: Dump Minecraft API signatures
        if: contains(github.event.head_commit.message, '[api]')
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python3 tools/ci_api_dump.py api-out && tools/ci_publish.sh api-out api

      # Boots a dedicated game-test server: loads the mod, every registry and every datapack file, then exits.
      - name: Server smoke test
        shell: bash
        run: |
          set -o pipefail
          timeout 900 ./gradlew runGameTestServer --no-daemon --console=plain 2>&1 | tee gametest.log

      - name: Server smoke test report
        if: always()
        shell: bash
        run: tools/ci_log_report.sh gametest.log

      # Commit messages containing [showcase] run tools/showcase/scenes.txt in a real client (copying the world the
      # game-test server just created) and publish the screenshots to the ci-artifacts branch (screenshots/).
      - name: In-game showcase
        if: contains(github.event.head_commit.message, '[showcase]')
        shell: bash
        env:
          LIBGL_ALWAYS_SOFTWARE: '1'
          FRIEREN_SHOWCASE: showcase/scenes.txt
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq xvfb libgl1-mesa-dri mesa-utils > /dev/null
          rm -rf run/saves/showcase && mkdir -p run/saves run/showcase
          cp -r run/gametestserver/gametestworld run/saves/showcase && rm -f run/saves/showcase/session.lock
          cp tools/showcase/scenes.txt run/showcase/scenes.txt
          printf 'onboardAccessibility:false\nskipMultiplayerWarning:true\njoinedFirstServer:true\n' >> run/options.txt
          set +e
          xvfb-run -a -s "-screen 0 1280x720x24" timeout 900 ./gradlew runClient --no-daemon --console=plain > showcase.log 2>&1
          echo "showcase exit code: $?"
          grep -E '\[showcase\]' showcase.log | head -60
          tools/ci_log_report.sh showcase.log
          mkdir -p shots && cp run/screenshots/*.png shots/ 2>/dev/null
          ls -la shots
          if ls shots/*.png > /dev/null 2>&1; then tools/ci_publish.sh shots screenshots; fi

      # Boots the client under a virtual display until the title screen, then stops it. Catches client mod loading,
      # model, texture, blockstate and renderer problems. A timeout stop is the expected outcome; a crash fails.
      - name: Client smoke test
        if: ${{ !contains(github.event.head_commit.message, '[quick]') }}
        shell: bash
        env:
          LIBGL_ALWAYS_SOFTWARE: '1'
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq xvfb libgl1-mesa-dri mesa-utils > /dev/null
          set +e
          xvfb-run -a -s "-screen 0 1280x720x24" timeout 480 ./gradlew runClient --no-daemon --console=plain > client.log 2>&1
          echo "runClient exit code: $? (124 = stopped by the timeout after loading, which is expected)"
          tools/ci_log_report.sh client.log
          if grep -qE 'Mod Loading has failed|Crash report saved|Failed to complete lifecycle event' client.log; then
            echo "::error::client crashed during startup (see report above)"
            exit 1
          fi
