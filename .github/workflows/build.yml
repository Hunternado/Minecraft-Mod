name: Build

on:
  push:
    branches: ['**']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Check resources
        run: python3 tools/validate_resources.py

      - name: Build
        run: ./gradlew build --no-daemon --stacktrace --warning-mode all

      - name: Upload mod jar
        uses: actions/upload-artifact@v4
        with:
          name: frieren-mod-jar
          path: build/libs/*.jar
          if-no-files-found: error

      - name: Probe Minecraft API signatures
        if: always()
        run: tools/ci_probe.sh

      # Boots a dedicated game-test server: loads the mod, every registry and every datapack file, then exits.
      - name: Server smoke test
        shell: bash
        run: |
          set -o pipefail
          timeout 900 ./gradlew runGameTestServer --no-daemon --console=plain 2>&1 | tee gametest.log

      - name: Server smoke test report
        if: always()
        shell: bash
        run: tools/ci_log_report.sh gametest.log

      # Boots the client under a virtual display until the title screen, then stops it. Catches client mod loading,
      # model, texture, blockstate and renderer problems. A timeout stop is the expected outcome; a crash fails.
      - name: Client smoke test
        shell: bash
        env:
          LIBGL_ALWAYS_SOFTWARE: '1'
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq xvfb libgl1-mesa-dri mesa-utils > /dev/null
          set +e
          xvfb-run -a -s "-screen 0 1280x720x24" timeout 480 ./gradlew runClient --no-daemon --console=plain > client.log 2>&1
          echo "runClient exit code: $? (124 = stopped by the timeout after loading, which is expected)"
          tools/ci_log_report.sh client.log
          if grep -qE 'Mod Loading has failed|Crash report saved|Failed to complete lifecycle event' client.log; then
            echo "::error::client crashed during startup (see report above)"
            exit 1
          fi
