# Forge mod metadata for Frieren: Mage's Journey.
# Values in ${...} are expanded from gradle.properties by the processResources task.

modLoader="javafml"
loaderVersion="[${forge_spec_version},)"
license="${mod_license}"
issueTrackerURL="https://github.com/hunternado/minecraft-mod/issues"

[[mods]]
modId="${mod_id}"
version="${mod_version}"
displayName="${mod_name}"
authors="${mod_authors}"
description='''A magic and adventure expansion inspired by Frieren: Beyond Journey's End.
Learn spells from grimoires, train your mana, conceal it from demons, pass the Continental Magic Association's
mage examinations, and face Aura the Guillotine.
This is an unofficial fan work. All art in this mod is original placeholder art.'''

[[dependencies.${mod_id}]]
    modId="forge"
    mandatory=true
    versionRange="[${forge_version},)"
    ordering="NONE"
    side="BOTH"

[[dependencies.${mod_id}]]
    modId="minecraft"
    mandatory=true
    versionRange="[${minecraft_version},${minecraft_next})"
    ordering="NONE"
    side="BOTH"
